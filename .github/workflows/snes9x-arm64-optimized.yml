name: Snes9x EX Plus ARM64 Optimized Build

on:
  workflow_dispatch:
    inputs:
      debug_build:
        description: 'Enable debug build'
        required: false
        default: false
        type: boolean
  push:
    branches: [ master, main, 'cursor/**' ]
    paths:
      - 'Snes9x/**'
      - 'EmuFramework/**'
      - 'imagine/**'
      - '.github/workflows/snes9x-arm64-optimized.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'Snes9x/**'
      - 'EmuFramework/**'
      - 'imagine/**'

env:
  NDK_VERSION: r26d
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4

jobs:
  build-snes9x-arm64:
    name: Build Snes9x EX Plus (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: false

    - name: Setup build environment
      run: |
        echo "ANDROID_NDK_PATH=${{ github.workspace }}/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV
        echo "EMUFRAMEWORK_PATH=${{ github.workspace }}/EmuFramework" >> $GITHUB_ENV
        echo "IMAGINE_PATH=${{ github.workspace }}/imagine" >> $GITHUB_ENV
        echo "IMAGINE_SDK_PATH=${{ github.workspace }}/imagine-sdk" >> $GITHUB_ENV
        echo "COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
        echo "BUILD_TIMESTAMP=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        cmake: 3.22.1
        accept-android-sdk-licenses: true

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
        link-to-sdk: true

    - name: Cache Imagine SDK (ARM64)
      uses: actions/cache@v4
      with:
        path: imagine-sdk
        key: imagine-sdk-arm64-${{ hashFiles('imagine/bundle/all/makeAll-android-arm64.sh', 'imagine/src/**/*.mk') }}
        restore-keys: |
          imagine-sdk-arm64-

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/native
        key: gradle-${{ runner.os }}-snes9x-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*') }}
        restore-keys: |
          gradle-${{ runner.os }}-snes9x-
          gradle-${{ runner.os }}-

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          autoconf automake autopoint bash clang cmake \
          file gawk gettext git libtool libtool-bin \
          llvm make pkg-config unzip wget \
          build-essential ninja-build ccache
        
        # ccacheの設定
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true

    - name: Setup Gradle optimization
      run: |
        mkdir -p ~/.gradle
        cat > ~/.gradle/gradle.properties << EOF
        org.gradle.daemon=true
        org.gradle.parallel=true
        org.gradle.configureondemand=true
        org.gradle.caching=true
        org.gradle.workers.max=4
        android.useAndroidX=true
        android.enableJetifier=true
        android.builder.sdkDownload=false
        EOF

    - name: Setup local.properties
      run: |
        # Imagine SDK用のlocal.properties設定
        mkdir -p imagine/src/base/android/imagine-v9
        echo "sdk.dir=$ANDROID_HOME" > imagine/src/base/android/imagine-v9/local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> imagine/src/base/android/imagine-v9/local.properties

    - name: Verify environment
      run: |
        echo "Java version:"
        java -version
        echo "Android SDK:"
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        echo "Android NDK:"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
        echo "NDK version:"
        cat $ANDROID_NDK_HOME/source.properties | head -3
        echo "Available make files:"
        ls -la imagine/make/shortcut/common-builds/ | grep android
        echo "Target makefile content:"
        cat imagine/make/shortcut/common-builds/android-arm64-release.mk

    - name: Build Imagine SDK (ARM64 only)
      run: |
        mkdir -p imagine-sdk
        cd imagine/bundle/all
        chmod +x ./makeAll-android-arm64.sh
        chmod +x ./runMakefiles.sh
        ./makeAll-android-arm64.sh install -j$(nproc)

    - name: Build EmuFramework (ARM64)
      run: |
        cd EmuFramework
        make -f ../imagine/make/shortcut/common-builds/android-arm64-release.mk install V=1 -j$(nproc)

    - name: Build Snes9x EX Plus APK (ARM64)
      run: |
        cd Snes9x
        echo "Building Snes9x EX Plus for ARM64..."
        
        # ARM64専用APKビルド
        make -f ../imagine/make/shortcut/common-builds/android-arm64-release.mk android-apk V=1 -j$(nproc) \
          ${{ inputs.debug_build == true && 'config=debug' || '' }}
        
        # APKファイルの確認
        echo "Looking for APK files..."
        find . -name "*.apk" -type f
        
        # 複数の可能なパスを確認
        APK_PATHS=(
          "target/android-arm64-release/build/outputs/apk/release/Snes9xEXPlus-release.apk"
          "target/android-release/build/outputs/apk/release/Snes9xEXPlus-release.apk"
          "build/outputs/apk/release/Snes9xEXPlus-release.apk"
        )
        
        APK_FOUND=""
        for path in "${APK_PATHS[@]}"; do
          if [ -f "$path" ]; then
            APK_FOUND="$path"
            break
          fi
        done
        
        if [ -n "$APK_FOUND" ]; then
          mkdir -p ../artifacts
          cp "$APK_FOUND" "../artifacts/Snes9xEXPlus-arm64-${COMMIT_SHA}-${BUILD_TIMESTAMP}.apk"
          echo "✅ APK built successfully: $(ls -lh ../artifacts/)"
        else
          echo "❌ APK build failed - no APK file found"
          echo "Directory structure:"
          find target/ -type f -name "*.apk" 2>/dev/null || echo "No target directory found"
          find build/ -type f -name "*.apk" 2>/dev/null || echo "No build directory found"
          exit 1
        fi

    - name: Verify APK
      run: |
        cd artifacts
        APK_FILE=$(ls Snes9xEXPlus-arm64-*.apk)
        echo "APK Info:"
        echo "File: $APK_FILE"
        echo "Size: $(du -h $APK_FILE | cut -f1)"
        
        # APKの基本情報を表示
        file "$APK_FILE"

    - name: Upload Snes9x EX Plus APK
      uses: actions/upload-artifact@v4
      with:
        name: Snes9xEXPlus-ARM64-${{ env.COMMIT_SHA }}
        path: artifacts/
        retention-days: 30
        compression-level: 6

    - name: Build summary
      if: always()
      run: |
        echo "## 🎮 Snes9x EX Plus ARM64 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ env.COMMIT_SHA }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture:** ARM64 only" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time:** ${{ env.BUILD_TIMESTAMP }}" >> $GITHUB_STEP_SUMMARY
        echo "- **NDK Version:** ${{ env.NDK_VERSION }}" >> $GITHUB_STEP_SUMMARY
        
        if [ -f artifacts/Snes9xEXPlus-arm64-*.apk ]; then
          APK_SIZE=$(du -h artifacts/Snes9xEXPlus-arm64-*.apk | cut -f1)
          echo "- **APK Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
        fi

    - name: ccache statistics
      if: always()
      run: |
        echo "## 🔧 Build Cache Statistics" >> $GITHUB_STEP_SUMMARY
        ccache --show-stats >> $GITHUB_STEP_SUMMARY || echo "ccache stats not available"
